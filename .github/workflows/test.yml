name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Callable so autorelease.yml can gate a release on exactly this suite
  # instead of keeping a hand copy of it that can drift.
  workflow_call:

# Cancel a stale push or PR run when a new commit lands. github.workflow is
# the CALLER's name, so the standalone run and the one autorelease calls land
# in different groups; sharing one on a push to main, cancel-in-progress
# would kill the release's own gate.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # The oldest Python the Home Assistant release hacs.json names
          # accepts (2026.2 requires 3.13.2 or later).
          python-version: "3.13"
          # The downloaded wheels, Home Assistant's among them, kept between
          # runs for as long as the pins stay the same.
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Restore the type checkers' caches
        # mypy checks every cached module against its source, so a cache
        # restored from an older commit only saves work, never hides any.
        uses: actions/cache@v6
        with:
          path: |
            .mypy_cache_strict
            .mypy_cache_all
          key: mypy-${{ hashFiles('requirements-dev.txt') }}-${{ github.sha }}
          restore-keys: mypy-${{ hashFiles('requirements-dev.txt') }}-
      - name: Restore the text read out of the fixture PDFs
        # Reading the cards is most of what the suite spends. fixture_text
        # keys every entry on the PDF's digest, the reader code and the pypdf
        # and pdfplumber versions, so an older cache restored through
        # restore-keys can only serve text the current code would read; what
        # no longer matches is simply not used. The tests choose which cards
        # are read and with which reader, so they are in the key too: a
        # changed test restores through restore-keys and saves what it read,
        # where an exact hit would never save.
        uses: actions/cache@v6
        with:
          path: tmp/fixture_text
          key: fixture-text-${{ hashFiles('tests/fixtures/**/*.pdf', 'tests/**/*.py', 'custom_components/be_gas_prices/providers/_pdf.py', 'requirements-dev.txt') }}
          restore-keys: fixture-text-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check (production code, --strict)
        # One cache per run: the two runs check with different options, and
        # sharing one cache made each throw the other's away.
        run: mypy --strict --cache-dir .mypy_cache_strict custom_components/be_gas_prices
      - name: Type check (tests and helper scripts, non-strict)
        # The tests are not --strict clean (the harness has untyped helpers
        # the integration never imports), but a plain mypy still catches the
        # optional index and the wrong argument. The scripts run as daily
        # workflows; checking them here surfaces a regression on the pull
        # request rather than in the next scheduled run.
        run: mypy --cache-dir .mypy_cache_all tests/ scripts/
      - name: Tests
        # Split across the runner's cores by file, so a file's fixtures are
        # built once in one worker. Each worker costs one Home Assistant
        # import, which is why this is here and not in addopts: it would make
        # a single-file run during development slower, not faster.
        run: pytest tests/ -q -n auto --dist loadfile
