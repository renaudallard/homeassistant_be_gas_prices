name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Callable so autorelease.yml can gate a release on exactly this suite
  # instead of keeping a hand copy of it that can drift.
  workflow_call:
  # The integration's requirements are not pinned here but installed as
  # Home Assistant installs them, so a release of one reaches installations
  # the day it is out, with no push here. Run daily to meet it the same day.
  schedule:
    - cron: "41 6 * * *"

# Cancel a stale push or PR run when a new commit lands. github.workflow is
# the CALLER's name, so the standalone run and the one autorelease calls land
# in different groups; sharing one on a push to main, cancel-in-progress
# would kill the release's own gate. The event is in the group too, so the
# daily run and a push to main do not cancel each other.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Both ends of what an installation reads its cards with: a new one gets
    # the newest release of each requirement the manifest allows, an older
    # one keeps what it had, down to the manifest's floor
    # (scripts/install_requirements.sh).
    strategy:
      fail-fast: false
      matrix:
        requirements: [newest, floor]
    name: test (${{ matrix.requirements }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # The oldest Python the Home Assistant release hacs.json names
          # accepts (2026.2 requires 3.13.2 or later).
          python-version: "3.13"
          # The downloaded wheels, Home Assistant's among them, kept between
          # runs for as long as the pins stay the same.
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Restore the type checkers' caches
        if: matrix.requirements == 'newest'
        # mypy checks every cached module against its source, so a cache
        # restored from an older commit only saves work, never hides any.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .mypy_cache_strict
            .mypy_cache_all
          key: mypy-${{ hashFiles('requirements-dev.txt') }}-${{ github.sha }}
          restore-keys: mypy-${{ hashFiles('requirements-dev.txt') }}-
      - name: Install dependencies
        id: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          scripts/install_requirements.sh ${{ matrix.requirements }}
          # What the fixture texts below are keyed on: the readers' releases
          # move without a change here.
          echo "packages=$(pip freeze | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore the text read out of the fixture PDFs
        # Reading the cards is most of what the suite spends. fixture_text
        # keys every entry on the PDF's digest, the reader code and the pypdf
        # and pdfplumber versions, so an older cache restored through
        # restore-keys can only serve text the current code would read; what
        # no longer matches is simply not used. The tests choose which cards
        # are read and with which reader, so they are in the key too: a
        # changed test restores through restore-keys and saves what it read,
        # where an exact hit would never save.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/fixture_text
          key: fixture-text-${{ matrix.requirements }}-${{ steps.install.outputs.packages }}-${{ hashFiles('tests/fixtures/**/*.pdf', 'tests/**/*.py', 'custom_components/be_gas_prices/providers/_pdf_render.py', 'custom_components/be_gas_prices/providers/_pdf_bound.py', 'custom_components/be_gas_prices/providers/_pdf_bound_pdfminer.py', 'requirements-dev.txt') }}
          restore-keys: fixture-text-${{ matrix.requirements }}-
      - name: Lint
        if: matrix.requirements == 'newest'
        run: |
          ruff check .
          ruff format --check .
      - name: Type check (production code, --strict)
        if: matrix.requirements == 'newest'
        # One cache per run: the two runs check with different options, and
        # sharing one cache made each throw the other's away.
        run: mypy --strict --cache-dir .mypy_cache_strict custom_components/be_gas_prices
      - name: Type check (tests and helper scripts, non-strict)
        if: matrix.requirements == 'newest'
        # The tests are not --strict clean (the harness has untyped helpers
        # the integration never imports), but a plain mypy still catches the
        # optional index and the wrong argument. The scripts run as daily
        # workflows; checking them here surfaces a regression on the pull
        # request rather than in the next scheduled run.
        run: mypy --cache-dir .mypy_cache_all tests/ scripts/
      - name: Tests
        # Split across the runner's cores by file, so a file's fixtures are
        # built once in one worker. Each worker costs one Home Assistant
        # import, which is why this is here and not in addopts: it would make
        # a single-file run during development slower, not faster.
        run: pytest tests/ -q -n auto --dist loadfile

  # The job above runs the Home Assistant release hacs.json names, which is
  # what an upgrade must not break, while users run the current one, whose
  # constraints also pick what a new installation reads its cards with:
  # pdfplumber 0.11.11 and Pillow 13 under 2026.11, where the floor's stop at
  # 0.11.9. This runs the suite there too, on the newest requirements as on a
  # new installation of that release. Home Assistant publishes its test
  # harness with each release, under the same version, so HA_VERSION moves
  # both. The type check stays above: 2026.11 types its schemas with
  # probatio, which the integration is not written against yet.
  test-current-ha:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HA_VERSION: "2026.11.3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # What this Home Assistant requires.
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "homeassistant==$HA_VERSION" \
            "pytest-homeassistant==$HA_VERSION" pytest-timeout==2.4.0
          scripts/install_requirements.sh newest
      - name: Tests
        # respx's own plugin would import httpx before Home Assistant
        # aliases it; the harness asks for it to be left out.
        run: pytest tests/ -q -n auto --dist loadfile -p no:respx
